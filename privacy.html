<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Policy — Inertia</title>
<meta name="robots" content="index, follow">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<style>
:root{--bg:#0a0806;--s1:#13100d;--s2:#1c1815;--b1:#2a241e;--b2:#3a322a;
  --text:#f5f0e8;--muted:#a89e93;--acc:#ff5e1a;--red:#e8506b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);
  font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;
  line-height:1.7;padding:28px 20px 70px}
.wrap{max-width:720px;margin:0 auto}
a{color:var(--acc)}
a:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
header{display:flex;align-items:center;gap:11px;padding-bottom:22px;margin-bottom:26px;
  border-bottom:1px solid var(--b1)}
header svg{width:30px;height:30px}
.brand{font-size:19px;font-weight:700;
  background:linear-gradient(120deg,#ffc857,#ff5e1a);-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent}
h2{font-size:25px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
h3{font-size:15.5px;font-weight:700;margin:26px 0 8px}
h3.warn{color:var(--red)}
p{margin-bottom:13px;font-size:14.5px}
ul{margin:0 0 14px 20px}
li{margin-bottom:8px;font-size:14.5px}
.muted{color:var(--muted);font-size:12.5px}
.note{background:var(--s2);border:1px solid var(--b1);border-left:3px solid var(--acc);
  border-radius:0 11px 11px 0;padding:15px 17px;margin:22px 0;font-size:13.5px}
nav{display:flex;gap:16px;flex-wrap:wrap;margin-top:40px;padding-top:22px;
  border-top:1px solid var(--b1);font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <svg viewBox="0 0 32 32" role="img" aria-label="Inertia logo">
    <title>Inertia</title>
    <circle cx="16" cy="16" r="13.5" fill="none" stroke="#ff8c2e" stroke-width="1.6" opacity=".55"/>
    <path d="M 6 10.5 L 19 10.5" stroke="#ffc857" stroke-width="2.6" stroke-linecap="round" opacity=".75"/>
    <path d="M 8 16 L 26 16" stroke="#ff5e1a" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 11 21.5 L 22 21.5" stroke="#ffa32e" stroke-width="2.6" stroke-linecap="round" opacity=".75"/>
    <circle cx="24.5" cy="10.5" r="1.7" fill="#ffc857"/>
  </svg>
  <span class="brand">inertia</span>
</header>

<main id="content"></main>

<nav aria-label="Legal pages">
  <a href="/">← Back to app</a>
  <a href="/privacy.html">Privacy</a>
  <a href="/terms.html">Terms</a>
  <a href="/cookies.html">Cookies</a>
</nav>
</div>

<script src="/legal.js"></script>
<script>
  document.getElementById('content').innerHTML = window.LEGAL.privacy;
</script>
</body>
</html>
