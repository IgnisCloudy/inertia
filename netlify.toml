[build]
  publish = "."

[build.environment]
  # SUPABASE_URL is public by design and also appears in index.html.
  # Exclude it from secret scanning so builds don't fail on a false positive.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[functions]
  node_bundler = "esbuild"

[functions."generate-plan"]
  timeout = 26

[functions."strava-sync"]
  timeout = 26
