<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline · Inertia</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0806">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/legal.css">
</head>
<body>
<main class="msg">
  <div class="msg-inner">
    <svg class="msg-mark" viewBox="0 0 32 32" role="img" aria-label="Inertia logo">
      <title>Inertia</title>
      <circle cx="16" cy="16" r="13.5" fill="none" stroke="#ff8c2e" stroke-width="1.6" opacity=".55"/>
      <path d="M 6 10.5 L 19 10.5" stroke="#ffc857" stroke-width="2.6" stroke-linecap="round" opacity=".75"/>
      <path d="M 8 16 L 26 16" stroke="#ff5e1a" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M 11 21.5 L 22 21.5" stroke="#ffa32e" stroke-width="2.6" stroke-linecap="round" opacity=".75"/>
      <circle cx="24.5" cy="10.5" r="1.7" fill="#ffc857"/>
    </svg>
    <p class="msg-code">No connection</p>
    <h1>You are offline.</h1>
    <p>Inertia needs a connection to load your plan and sync sessions. Anything already loaded on this device is still there once you reconnect.</p>
    <div class="msg-actions">
      <a class="go" href="/app.html">Try again</a>
      <a class="alt" href="/">Back to the home page</a>
    </div>
  </div>
</main>
</body>
</html>
